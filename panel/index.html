<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Vinted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg:#07080d; --bg2:#0c0e15; --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.06);
    --ink:#eef0f6; --mut:#8a90a3; --line:rgba(255,255,255,.08);
    --acc:#5eead4; --acc2:#8b7bff; --accbg:rgba(94,234,212,.10); --accglow:rgba(94,234,212,.35);
    --warn:#fbbf24; --warnbg:rgba(251,191,36,.10); --bad:#fb7185; --badbg:rgba(251,113,133,.12);
    --shadow:0 10px 40px -12px rgba(0,0,0,.7);
    --r:18px;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; color:var(--ink); font:14.5px/1.5 Inter,system-ui,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(800px 420px at 90% -80px, rgba(139,123,255,.22), transparent 70%),
      radial-gradient(700px 380px at -5% 10%, rgba(94,234,212,.14), transparent 70%),
      linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px) 0 0/44px 44px,
      linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0/44px 44px,
      var(--bg);
    background-attachment:fixed; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 20px; }
  header { padding:6px 0 0; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 0 6px; flex-wrap:wrap; }
  h1 { font-size:20px; margin:0; font-weight:700; letter-spacing:-.02em; display:flex; align-items:center; gap:12px; }
  h1::before { content:"👟"; display:grid; place-items:center; width:40px; height:40px; border-radius:12px; font-size:19px;
    background:linear-gradient(135deg,rgba(94,234,212,.25),rgba(139,123,255,.25)); border:1px solid var(--line); box-shadow:0 0 24px -6px var(--accglow); }
  .pill { padding:6px 14px; border-radius:99px; font-size:12.5px; font-weight:600; color:var(--acc); background:var(--accbg);
    border:1px solid rgba(94,234,212,.25); letter-spacing:.02em; }
  main.wrap { padding-top:14px; padding-bottom:70px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px; margin-bottom:18px;
    box-shadow:var(--shadow); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .hero { background:linear-gradient(135deg,rgba(94,234,212,.10),rgba(139,123,255,.08) 60%,var(--card)); border-color:rgba(94,234,212,.22); }
  h2 { font-size:12px; margin:0 0 14px; text-transform:uppercase; letter-spacing:.12em; color:var(--mut); font-weight:700; }
  .hero h2 { color:var(--ink); }
  .hint { color:var(--mut); font-size:13px; }
  .row { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .dash { display:grid; gap:18px; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); align-items:start; }
  @media (max-width:860px) { .dash { grid-template-columns:1fr; } }

  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); margin-bottom:18px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 14px 12px; backdrop-filter:blur(14px); }
  .kpi .k { color:var(--mut); font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; font-weight:700; }
  .kpi .v { font-size:26px; font-weight:750; margin-top:4px; letter-spacing:-.02em; font-variant-numeric:tabular-nums;
    background:linear-gradient(135deg,#fff,var(--acc)); -webkit-background-clip:text; background-clip:text; color:transparent; }

  button.btn { border:0; font:inherit; font-weight:700; padding:11px 20px; border-radius:12px; cursor:pointer; color:#041512;
    background:linear-gradient(135deg,var(--acc),#7dd3fc); box-shadow:0 8px 24px -8px var(--accglow); transition:transform .12s, box-shadow .12s; }
  button.btn:hover { transform:translateY(-1px); box-shadow:0 12px 28px -8px var(--accglow); }
  button.btn:active { transform:scale(.97); }
  button.btn.ghost { background:var(--card2); color:var(--ink); border:1px solid var(--line); box-shadow:none; }
  button.btn:disabled { opacity:.5; }

  .bar { height:7px; background:rgba(255,255,255,.07); border-radius:99px; overflow:hidden; }
  .bar i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--acc),var(--acc2)); box-shadow:0 0 12px var(--accglow); transition:width .4s; }

  .steps { list-style:none; margin:14px 0; padding:0; }
  .steps li { display:flex; gap:14px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line); border-radius:14px; margin-bottom:8px; cursor:pointer; background:rgba(255,255,255,.02); transition:background .15s, border-color .15s; }
  .steps li:hover { background:var(--card2); }
  .steps li.done { background:var(--accbg); border-color:rgba(94,234,212,.25); }
  .steps li.done .tx { color:var(--mut); text-decoration:line-through; }
  .chk { width:22px; height:22px; flex:none; border-radius:7px; border:2px solid rgba(255,255,255,.22); display:grid; place-items:center; font-size:13px; color:transparent; margin-top:1px; }
  .done .chk { background:var(--acc); border-color:var(--acc); color:#041512; box-shadow:0 0 14px var(--accglow); }
  .dont { background:var(--warnbg); color:var(--warn); border:1px solid rgba(251,191,36,.2); padding:10px 14px; border-radius:12px; font-size:13.5px; margin:10px 0; }
  .timer { font-variant-numeric:tabular-nums; font-size:34px; font-weight:750; letter-spacing:-.02em; }

  .cal { display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr)); gap:8px; }
  .tile { border:1px solid var(--line); border-radius:12px; padding:9px 0 8px; text-align:center; cursor:pointer; background:rgba(255,255,255,.02); transition:transform .12s, background .12s; }
  .tile:hover { transform:translateY(-2px); background:var(--card2); }
  .tile b { display:block; font-size:16px; } .tile span { font-size:10.5px; color:var(--mut); }
  .tile.done { background:var(--accbg); border-color:rgba(94,234,212,.25); } .tile.done b { color:var(--acc); }
  .tile.cur { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc), 0 0 18px -2px var(--accglow); }
  .tile.miss { background:var(--warnbg); border-color:rgba(251,191,36,.25); } .tile.miss b { color:var(--warn); }
  .tile.sel { background:var(--card2); }
  .lg { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; font-size:12px; color:var(--mut); }

  table { width:100%; border-collapse:collapse; font-size:13.5px; }
  th,td { text-align:left; padding:11px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mut); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; font-weight:700; }
  tr:last-child td { border-bottom:0; }
  .scroll { overflow-x:auto; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.18) transparent; }
  .scroll::-webkit-scrollbar { height:8px; } .scroll::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:8px; } .scroll::-webkit-scrollbar-track { background:transparent; }
  .tag { padding:3px 11px; border-radius:99px; font-size:12px; font-weight:600; background:var(--accbg); color:var(--acc); }
  .tag.revision { background:var(--warnbg); color:var(--warn); } .tag.rechazado { background:var(--badbg); color:var(--bad); }
  .empty { color:var(--mut); padding:12px 0; }
  .brk { display:grid; grid-template-columns:1fr auto; gap:6px 14px; align-items:center; font-size:13.5px; }
  .brk .bar { grid-column:1 / -1; height:5px; margin-bottom:8px; }
  .ready { padding:14px 16px; border-radius:14px; border:1px solid var(--line); margin-top:16px; }
  .ready.ok { background:var(--accbg); border-color:rgba(94,234,212,.3); } .ready.no { background:var(--warnbg); border-color:rgba(251,191,36,.25); }
  .ready b { display:block; margin-bottom:4px; }
  ol.mini { margin:8px 0 0 18px; padding:0; } ol.mini li { margin:3px 0; }
  input, select { transition:border-color .15s, box-shadow .15s; }
  input:focus, select:focus { outline:0; border-color:var(--acc) !important; box-shadow:0 0 0 3px var(--accbg); }
  a { color:var(--acc); }

  /* roadmap horizontal */
  .stp { display:grid; gap:10px; grid-template-columns:repeat(7,minmax(0,1fr)); }
  @media (max-width:900px) { .stp { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 var(--accglow); } 100% { box-shadow:0 0 0 14px transparent; } }
  .s { border:1px solid var(--line); border-radius:16px; padding:14px 8px 12px; background:rgba(255,255,255,.025); text-align:center; }
  .s .dot { width:38px; height:38px; margin:0 auto 8px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.04); border:2px solid var(--line); font-size:16px; }
  .s .nm { font-size:12.5px; font-weight:700; line-height:1.25; min-height:32px; }
  .s .rg { font-size:11px; color:var(--mut); margin:3px 0 8px; }
  .s .bar { height:4px; }
  .s.done { background:var(--accbg); border-color:rgba(94,234,212,.25); }
  .s.done .dot { background:var(--acc); border-color:var(--acc); color:#041512; font-weight:800; box-shadow:0 0 16px var(--accglow); }
  .s.cur { border-color:var(--acc); background:linear-gradient(180deg,rgba(94,234,212,.10),transparent); }
  .s.cur .dot { border-color:var(--acc); animation:pulse 1.8s infinite; }
  .s.todo { opacity:.75; }
  .s.gate .dot { background:var(--warnbg); border-color:var(--warn); }
  .s.gate.ok { border-color:var(--acc); } .s.gate.ok .dot { background:var(--acc); border-color:var(--acc); }

  h2[style*="font-size"] { text-transform:none; letter-spacing:-.015em; color:var(--ink); font-weight:700; }

  /* ===== compacto ===== */
  /* ===== tipografía ===== */
  :root { --body:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif; --head:"Space Grotesk","Helvetica Neue",Helvetica,Arial,sans-serif; }
  body, button, input, select { font-family:var(--body); }
  body { font-size:14px; letter-spacing:-.005em; font-feature-settings:"cv11","ss01"; }
  h1, h2, .rmh b, .kpi .v, .timer, .tile b, .nm, #nav button, .pill, .tr h2 { font-family:var(--head); }
  h1 { font-size:18px; font-weight:700; letter-spacing:-.03em; }
  h2 { font-weight:600; letter-spacing:.14em; }
  .kpi .v { font-weight:700; letter-spacing:-.03em; }
  .timer { font-weight:600; letter-spacing:-.04em; }
  .today h2, h2[style*="font-size"] { font-family:var(--head); letter-spacing:-.03em; font-weight:700; }
  .tile b, .nm { font-weight:600; }
  svg text { font-family:var(--head); }

  .view { display:none; } .view.on { display:block; }
  .wrap { max-width:1240px; padding:0 18px; }
  .top { padding:12px 0 10px; gap:14px; flex-wrap:nowrap; }
  @media (max-width:760px) { .top { flex-wrap:wrap; } }
  h1 { font-size:17px; } h1::before { width:34px; height:34px; font-size:16px; border-radius:10px; }
  #nav { display:flex; gap:4px; padding:4px; background:var(--card); border:1px solid var(--line); border-radius:14px; margin:0 auto; }
  #nav button { border:0; background:transparent; color:var(--mut); font:inherit; font-weight:600; font-size:13px; padding:7px 16px; border-radius:10px; cursor:pointer; }
  #nav button.on { background:linear-gradient(135deg,rgba(94,234,212,.22),rgba(139,123,255,.22)); color:#fff; box-shadow:0 0 0 1px rgba(94,234,212,.3) inset; }
  main.wrap { padding-top:4px; padding-bottom:40px; }
  .card { padding:16px; margin-bottom:14px; border-radius:16px; }
  h2 { margin-bottom:10px; font-size:11px; }

  .kpis { display:grid; gap:10px; grid-template-columns:repeat(7,minmax(0,1fr)); margin-bottom:14px; }
  @media (max-width:1000px) { .kpis { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  @media (max-width:520px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .kpis .kpi { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; }
  .kpi .ico { font-size:18px; width:34px; height:34px; display:grid; place-items:center; border-radius:10px; background:rgba(255,255,255,.05); flex:none; }
  .kpis .kpi .v { font-size:18px; margin-top:0; line-height:1.15; }
  .kpis .kpi .k { font-size:9.5px; }

  .rm { padding:12px 16px 14px; }
  .rmh { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .rmh b { font-size:13px; }
  .rm .bar { height:5px; margin-bottom:12px; }
  .stp { gap:8px; }
  .s { display:flex; align-items:center; gap:9px; text-align:left; padding:9px 10px 12px; border-radius:12px; position:relative; overflow:hidden; }
  .s .dot { width:28px; height:28px; margin:0; font-size:13px; flex:none; border-width:2px; }
  .s .nm { font-size:11.5px; min-height:0; line-height:1.2; }
  .s .rg { font-size:10px; margin:1px 0 0; }
  .s > div:not(.dot):not(.bar) { min-width:0; }
  .s .bar { position:absolute; left:0; right:0; bottom:0; height:3px; border-radius:0; }
  .s .txt { display:block; min-width:0; }

  .main2 { display:grid; gap:14px; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); align-items:start; }
  @media (max-width:900px) { .main2 { grid-template-columns:1fr; } }
  .main2 > div > .card:last-child, .side > .card:last-child { margin-bottom:0; }
  .side { display:grid; gap:14px; }
  .side > * { min-width:0; } .side .card { margin:0; }

  .today .th { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .tmr { display:flex; align-items:center; gap:8px; }
  .timer { font-size:22px; }
  button.btn.sm { padding:6px 12px; border-radius:10px; }
  .steps { margin:0 0 10px; } .steps li { padding:9px 12px; margin-bottom:6px; gap:11px; font-size:13.5px; border-radius:12px; }
  .chk { width:20px; height:20px; font-size:12px; }
  .dont { padding:8px 12px; font-size:12.5px; margin:8px 0; }
  .mini-alert { margin-top:10px; padding:6px 10px; border-radius:10px; font-size:12px; color:var(--warn); background:var(--warnbg); }
  #today > p.hint { margin:10px 0 0; font-size:11.5px; }

  .tr .trh { display:flex; gap:14px; align-items:center; }
  .tr .trh svg { width:104px; height:104px; flex:none; }
  .tr .trc { flex:1; min-width:0; }
  .ready { margin-top:0; padding:9px 12px; border-radius:12px; font-size:12.5px; }
  .ready .hint { font-size:12px; line-height:1.5; }
  details summary { cursor:pointer; color:var(--mut); font-size:12.5px; margin-top:10px; font-weight:600; }
  details[open] summary { color:var(--ink); }
  .brk { margin-top:10px; font-size:12.5px; }

  .cal { grid-template-columns:repeat(auto-fill,minmax(34px,1fr)); gap:6px; }
  .tile { padding:7px 0; border-radius:10px; } .tile b { font-size:13px; }
  .legend { margin:0; gap:10px; font-size:11px; }
  .dd { margin-top:12px; padding:12px; border-radius:12px; background:rgba(255,255,255,.03); border:1px solid var(--line); font-size:13px; }
  .dd ol.mini { margin:6px 0 6px 16px; }
  th, td { padding:9px 8px; }

  /* ===== chat ===== */
  .chat { display:flex; flex-direction:column; gap:8px; }
  .msg { display:flex; gap:9px; align-items:flex-start; }
  .av { width:28px; height:28px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:14px; }
  .av:not(:empty) { background:linear-gradient(135deg,rgba(94,234,212,.25),rgba(139,123,255,.25)); border:1px solid var(--line); }
  .bub { background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:4px 16px 16px 16px; padding:10px 14px; font-size:13.5px; line-height:1.55; max-width:100%; min-width:0; }
  .bub.warn { background:var(--warnbg); border-color:rgba(251,191,36,.22); color:var(--warn); font-size:13px; }
  .bub.ok { background:var(--accbg); border-color:rgba(94,234,212,.28); color:var(--acc); }
  .bub .steps { margin:8px 0 0; } .bub .steps li { background:rgba(0,0,0,.18); }
  .bub .steps li:last-child { margin-bottom:0; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1 id="title">Panel Vinted</h1>
    <nav id="nav"><button data-t="v-panel" class="on">Panel</button><button data-t="v-arts">Artículos</button><button data-t="v-reg">Registro</button></nav>
    <span class="pill" id="pill"></span>
  </div>
</div></header>

<main class="wrap">
  <section id="v-panel" class="view on">
    <div class="kpis" id="kpis"></div>
    <div class="card rm"><div class="rmh"><b>🗺️ Roadmap</b><span class="hint" id="roadtxt"></span></div>
      <div class="bar"><i id="roadbar"></i></div><div class="stp" id="roadmap"></div></div>
    <div class="main2">
      <div id="today"></div>
      <div class="side">
        <div id="trust"></div>
        <div class="card"><div class="rmh"><b>📅 Calendario</b>
          <span class="legend"><span><i class="lg" style="background:var(--acc)"></i>hecho</span><span><i class="lg" style="background:var(--warn)"></i>pendiente</span><span><i class="lg" style="border:2px solid var(--acc)"></i>hoy</span></span></div>
          <div class="cal" id="cal"></div><div id="dayDetail"></div></div>
      </div>
    </div>
  </section>

  <section id="v-arts" class="view">
    <div class="card"><h2>Añadir artículo</h2><div id="fList"></div></div>
    <div class="card"><h2>Artículos</h2><div class="scroll" id="listings"></div></div>
  </section>

  <section id="v-reg" class="view">
    <div class="main2">
      <div>
        <div class="card"><h2>Registrar el día</h2><div id="fAct"></div></div>
        <div class="card"><h2>Añadir valoración</h2><div id="fRat"></div></div>
      </div>
      <div>
        <div class="card"><h2>Actividad diaria</h2><div class="scroll" id="activity"></div></div>
        <div class="card"><h2>Valoraciones</h2><div id="ratings"></div></div>
        <div class="card"><h2>Copia de seguridad</h2><p class="hint" style="margin-top:0">Tus datos se guardan en este navegador. Descarga una copia de vez en cuando.</p>
          <div class="row"><button class="btn ghost" id="exp">Descargar copia</button>
          <button class="btn ghost" id="imp">Restaurar copia</button><input type="file" id="impf" accept=".json" hidden></div></div>
      </div>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script>
const D = window.DATA;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => (n==null||isNaN(n)) ? "–" : Number(n).toFixed(2).replace(".",",")+" €";

// ---- estado local (casillas) ----
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};
let dayDone = store.get("vp_days", {});
let stepDone = store.get("vp_steps", {});
let selDay = null, timer = { run:false, left:0, id:null };

// Datos introducidos en el propio panel (se guardan en este navegador) + los de data.js
["listings","activity","ratings"].forEach(k => {
  D[k] = (D[k] || []).concat(store.get("vp_"+k, []).map(x => ({ ...x, _loc:true })));
});
const saveLoc = k => store.set("vp_"+k, D[k].filter(x => x._loc).map(({_loc, ...r}) => r));
function addItem(k, item) { D[k].push({ ...item, _loc:true }); saveLoc(k); }
const num = v => (v === "" || v == null) ? 0 : Number(v);

const startDate = () => D.account.createdAt || store.get("vp_start", null);
function daysSince(d) {
  if (!d) return null;
  const a = new Date(d + "T00:00:00"), n = new Date(); n.setHours(0,0,0,0);
  return Math.max(0, Math.round((n - a) / 86400000));
}
const todayIso = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

// ---- índice de confianza ----
function trust() {
  const L = D.listings, A = D.activity, R = D.ratings;
  const age = daysSince(startDate()) || 0;
  const sum = k => A.reduce((a,x)=>a+(+x[k]||0),0);
  const ops = sum("ventas") + sum("compras");
  const avg = R.length ? R.reduce((a,r)=>a+r.estrellas,0)/R.length : 0;
  const prof = D.plan.slice(0,4).filter(p=>dayDone[p.d]).length / 4;
  const conPrueba = L.length ? L.filter(x=>x.prueba).length / L.length : 0;
  const parts = [
    ["Perfil completo y verificado (días 1-4)", 15, prof, "Completa los días 1 a 4 del plan."],
    ["Antigüedad (mín. 21 días, ideal 30)", 25, Math.min(age/30,1), "Solo el tiempo: el factor que más pesa y no se acelera."],
    ["Artículos publicados (~10)", 10, Math.min(L.length/10,1), "Sube artículos reales al ritmo del plan."],
    ["Operaciones reales (4)", 15, Math.min(ops/4,1), "Haz una compra o venta real que necesites."],
    ["Valoraciones (~7, media ≥4)", 15, Math.min(R.length/7,1) * (avg && avg<4 ? .5 : 1), "Envía rápido y pide la valoración con educación."],
    ["Uso regular (~12 días registrados)", 10, Math.min(A.length/12,1), "Cuéntame cada día lo que haces."],
    ["Artículos con prueba de compra", 10, conPrueba, "Anota la prueba de compra de cada par."]
  ];
  const pts = parts.reduce((a,p)=>a+p[1]*p[2],0);
  const pen = Math.min(30, sum("avisos")*5 + L.filter(x=>x.estado==="revision").length*3 + L.filter(x=>x.estado==="rechazado").length*5);
  const score = Math.max(0, pts - pen);
  const checks = [
    ["Más de 21 días de antigüedad (ideal 30)", age >= 21],
    ["~7 valoraciones con media ≥4", R.length >= 7 && avg >= 4],
    ["~10 artículos publicados", L.length >= 10],
    ["Sin avisos ni rechazos", sum("avisos")===0 && L.filter(x=>x.estado==="rechazado").length===0],
    ["Índice de confianza ≥ 3,5", score/20 >= 3.5]
  ];
  return { parts, pen, score, checks, ready: checks.every(c=>c[1]), avg, ops, age };
}

function ring(score) {
  const r = 52, c = 2*Math.PI*r, off = c*(1-score/100);
  return `<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--line)" stroke-width="12"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--acc)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/>
    <text x="65" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="var(--ink)">${(score/20).toFixed(1)}</text>
    <text x="65" y="84" text-anchor="middle" font-size="12" fill="var(--mut)">de 5</text></svg>`;
}

const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function toggleTimer() {

// El panel se entera solo cuando cambia el día (medianoche) o al volver a la pestaña
let lastDay = todayIso();
const checkDay = () => { if (todayIso() !== lastDay) { lastDay = todayIso(); selDay = null; render(); } };
setInterval(checkDay, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); });
renderForms();
render();
</script>
</body>
</html>
