<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Vinted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0b0c; --s1:#111113; --s2:#18181b; --card:#111113; --card2:#18181b;
    --line:#26262b; --ink:#ededee; --mut:#8c8c95;
    --acc:#ededee; --acc2:#ededee; --accbg:#1c1c20; --accglow:transparent;
    --ok:#7fd59a; --warn:#e0b25a; --warnbg:transparent; --bad:#e5786d; --badbg:transparent;
    --font:Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; background:var(--bg); color:var(--ink); font:13.5px/1.55 var(--font); letter-spacing:-.003em; -webkit-font-smoothing:antialiased; font-feature-settings:"tnum","cv11"; }
  button, input, select { font-family:var(--font); }
  .wrap { max-width:1180px; margin:0 auto; padding:0 24px; }
  a { color:var(--ink); }

  /* cabecera */
  header { border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:28px; height:56px; }
  h1 { margin:0; font-size:14px; font-weight:600; letter-spacing:-.01em; }
  #nav { display:flex; gap:2px; align-self:stretch; }
  #nav button { border:0; background:none; color:var(--mut); font-size:13px; font-weight:500; padding:0 12px; cursor:pointer; border-bottom:1px solid transparent; margin-bottom:-1px; }
  #nav button:hover { color:var(--ink); }
  #nav button.on { color:var(--ink); border-bottom-color:var(--ink); }
  .pill { margin-left:auto; color:var(--mut); font-size:12.5px; }

  main.wrap { padding-top:24px; padding-bottom:64px; }
  .view { display:none; } .view.on { display:block; }

  /* tarjetas */
  .card { background:var(--s1); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  .hero { background:var(--s1); }
  h2 { margin:0 0 12px; font-size:12.5px; font-weight:500; color:var(--mut); }
  h2[style*="font-size"] { color:var(--ink); font-weight:600; letter-spacing:-.015em; }
  .hint { color:var(--mut); font-size:12.5px; }
  .row { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }

  /* resumen */
  .kpis { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:16px; }
  @media (max-width:1000px) { .kpis { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  @media (max-width:520px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .kpi { background:var(--s1); padding:12px 16px; }
  .kpi .k { color:var(--mut); font-size:12px; }
  .kpi .v { font-size:20px; font-weight:600; letter-spacing:-.02em; margin-top:2px; }

  /* botones */
  button.btn { border:1px solid var(--ink); background:var(--ink); color:#0b0b0c; font-size:13px; font-weight:500; padding:8px 14px; border-radius:7px; cursor:pointer; }
  button.btn:hover { opacity:.88; }
  button.btn.ghost { background:transparent; color:var(--ink); border-color:var(--line); }
  button.btn.ghost:hover { background:var(--s2); opacity:1; }
  button.btn.sm { padding:5px 10px; font-size:12.5px; }

  .bar { height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--ink); transition:width .3s; }

  /* roadmap */
  .rm { padding:14px 18px 16px; }
  .rmh { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .rmh b { font-size:13px; font-weight:600; }
  .rm .bar { margin-bottom:14px; }
  .stp { display:grid; gap:8px; grid-template-columns:repeat(7,minmax(0,1fr)); }
  @media (max-width:900px) { .stp { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .s { display:flex; align-items:center; gap:10px; padding:10px 12px 13px; border:1px solid var(--line); border-radius:8px; position:relative; overflow:hidden; opacity:.55; }
  .s .dot { width:22px; height:22px; flex:none; border-radius:50%; border:1px solid var(--line); display:grid; place-items:center; font-size:11px; color:var(--mut); }
  .s .nm { font-size:12px; font-weight:500; line-height:1.25; }
  .s .rg { font-size:11px; color:var(--mut); }
  .s .bar { position:absolute; left:0; right:0; bottom:0; height:2px; border-radius:0; }
  .s.done { opacity:1; } .s.done .dot { background:var(--ink); border-color:var(--ink); color:#0b0b0c; }
  .s.cur { opacity:1; border-color:var(--ink); } .s.cur .dot { border-color:var(--ink); color:var(--ink); }
  .s.gate.ok { opacity:1; border-color:var(--ok); } .s.gate.ok .dot { background:var(--ok); border-color:var(--ok); color:#0b0b0c; }

  .main2 { display:grid; gap:16px; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); align-items:start; }
  @media (max-width:900px) { .main2 { grid-template-columns:1fr; } }
  .main2 > div > .card:last-child { margin-bottom:0; }
  .side { display:grid; gap:16px; } .side > * { min-width:0; } .side .card { margin:0; }

  /* hoy / chat */
  .today .th { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .tmr { display:flex; align-items:center; gap:8px; }
  .timer { font-size:20px; font-weight:500; letter-spacing:-.02em; }
  .chat { display:flex; flex-direction:column; gap:8px; }
  .msg { display:flex; gap:10px; align-items:flex-start; }
  .av { width:6px; height:6px; margin-top:12px; flex:none; border-radius:50%; background:var(--line); }
  .bub { background:var(--s2); border-radius:4px 12px 12px 12px; padding:10px 14px; line-height:1.55; min-width:0; max-width:100%; }
  .bub.warn { background:transparent; border:1px solid var(--line); color:var(--mut); }
  .bub.ok { background:transparent; border:1px solid var(--ok); color:var(--ok); }
  .steps { list-style:none; margin:0; padding:0; }
  .bub .steps { margin-top:10px; }
  .steps li { display:flex; gap:10px; align-items:flex-start; padding:9px 11px; border:1px solid var(--line); border-radius:7px; margin-bottom:6px; cursor:pointer; background:var(--s1); }
  .steps li:hover { background:var(--s2); }
  .steps li:last-child { margin-bottom:0; }
  .steps li.done .tx { color:var(--mut); text-decoration:line-through; }
  .chk { width:16px; height:16px; flex:none; border-radius:4px; border:1px solid var(--mut); display:grid; place-items:center; font-size:11px; color:transparent; margin-top:2px; }
  .done .chk { background:var(--ink); border-color:var(--ink); color:#0b0b0c; }
  .dont { color:var(--mut); border-left:2px solid var(--line); padding:2px 0 2px 10px; font-size:12.5px; margin:8px 0; background:none; }
  .mini-alert { color:var(--mut); }

  /* indice */
  .tr .trh { display:flex; gap:18px; align-items:center; }
  .tr .trh svg { width:96px; height:96px; flex:none; } svg text { font-family:var(--font); }
  .tr .trc { flex:1; min-width:0; }
  .ready { padding:0; border:0; background:none; font-size:12.5px; }
  .ready b { display:block; margin-bottom:4px; font-weight:600; }
  .ready.ok b { color:var(--ok); }
  .ready .hint { line-height:1.6; }
  details summary { cursor:pointer; color:var(--mut); font-size:12.5px; margin-top:12px; }
  details[open] summary { color:var(--ink); }
  .brk { display:grid; grid-template-columns:1fr auto; gap:5px 14px; margin-top:10px; font-size:12.5px; }
  .brk .bar { grid-column:1 / -1; margin-bottom:6px; }

  /* calendario */
  .cal { display:grid; grid-template-columns:repeat(auto-fill,minmax(34px,1fr)); gap:6px; }
  .tile { border:1px solid var(--line); border-radius:6px; padding:7px 0; text-align:center; cursor:pointer; color:var(--mut); }
  .tile:hover { background:var(--s2); }
  .tile b { font-size:12.5px; font-weight:500; }
  .tile.done { background:var(--s2); color:var(--ink); }
  .tile.miss { border-color:var(--warn); color:var(--warn); }
  .tile.cur { border-color:var(--ink); color:var(--ink); }
  .tile.sel { background:var(--s2); }
  .legend { display:flex; gap:12px; font-size:11.5px; color:var(--mut); }
  .lg { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:5px; }
  .dd { margin-top:14px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; }
  .dd ol.mini { margin:6px 0 6px 16px; padding:0; }
  ol.mini li { margin:3px 0; }

  /* tablas y formularios */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mut); font-size:12px; font-weight:500; }
  tr:last-child td { border-bottom:0; }
  .scroll { overflow-x:auto; scrollbar-width:thin; scrollbar-color:var(--line) transparent; }
  .tag { font-size:12px; color:var(--ok); } .tag.revision { color:var(--warn); } .tag.rechazado { color:var(--bad); }
  .empty { color:var(--mut); padding:10px 0; }
  input, select { transition:border-color .12s; }
  input:focus, select:focus { outline:0; border-color:var(--ink) !important; }
  input, select { border-radius:7px !important; }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1 id="title">Panel Vinted</h1>
    <nav id="nav"><button data-t="v-panel" class="on">Panel</button><button data-t="v-arts">Artículos</button><button data-t="v-reg">Registro</button></nav>
    <span class="pill" id="pill"></span>
  </div>
</div></header>

<main class="wrap">
  <section id="v-panel" class="view on">
    <div class="kpis" id="kpis"></div>
    <div class="card rm"><div class="rmh"><b> Roadmap</b><span class="hint" id="roadtxt"></span></div>
      <div class="bar"><i id="roadbar"></i></div><div class="stp" id="roadmap"></div></div>
    <div class="main2">
      <div id="today"></div>
      <div class="side">
        <div id="trust"></div>
        <div class="card"><div class="rmh"><b> Calendario</b>
          <span class="legend"><span><i class="lg" style="background:var(--acc)"></i>hecho</span><span><i class="lg" style="background:var(--warn)"></i>pendiente</span><span><i class="lg" style="border:2px solid var(--acc)"></i>hoy</span></span></div>
          <div class="cal" id="cal"></div><div id="dayDetail"></div></div>
      </div>
    </div>
  </section>

  <section id="v-arts" class="view">
    <div class="card"><h2>Añadir artículo</h2><div id="fList"></div></div>
    <div class="card"><h2>Artículos</h2><div class="scroll" id="listings"></div></div>
  </section>

  <section id="v-reg" class="view">
    <div class="main2">
      <div>
        <div class="card"><h2>Registrar el día</h2><div id="fAct"></div></div>
        <div class="card"><h2>Añadir valoración</h2><div id="fRat"></div></div>
      </div>
      <div>
        <div class="card"><h2>Actividad diaria</h2><div class="scroll" id="activity"></div></div>
        <div class="card"><h2>Valoraciones</h2><div id="ratings"></div></div>
        <div class="card"><h2>Copia de seguridad</h2><p class="hint" style="margin-top:0">Tus datos se guardan en este navegador. Descarga una copia de vez en cuando.</p>
          <div class="row"><button class="btn ghost" id="exp">Descargar copia</button>
          <button class="btn ghost" id="imp">Restaurar copia</button><input type="file" id="impf" accept=".json" hidden></div></div>
      </div>
    </div>
  </section>
</main>

<script src="data.js"></script>
<script>
const D = window.DATA;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => (n==null||isNaN(n)) ? "–" : Number(n).toFixed(2).replace(".",",")+" €";

// ---- estado local (casillas) ----
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
};
let dayDone = store.get("vp_days", {});
let stepDone = store.get("vp_steps", {});
let selDay = null, timer = { run:false, left:0, id:null };

// Datos introducidos en el propio panel (se guardan en este navegador) + los de data.js
["listings","activity","ratings"].forEach(k => {
  D[k] = (D[k] || []).concat(store.get("vp_"+k, []).map(x => ({ ...x, _loc:true })));
});
const saveLoc = k => store.set("vp_"+k, D[k].filter(x => x._loc).map(({_loc, ...r}) => r));
function addItem(k, item) { D[k].push({ ...item, _loc:true }); saveLoc(k); }
const num = v => (v === "" || v == null) ? 0 : Number(v);

const startDate = () => D.account.createdAt || store.get("vp_start", null);
function daysSince(d) {
  if (!d) return null;
  const a = new Date(d + "T00:00:00"), n = new Date(); n.setHours(0,0,0,0);
  return Math.max(0, Math.round((n - a) / 86400000));
}
const todayIso = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };

// ---- índice de confianza ----
function trust() {
  const L = D.listings, A = D.activity, R = D.ratings;
  const age = daysSince(startDate()) || 0;
  const sum = k => A.reduce((a,x)=>a+(+x[k]||0),0);
  const ops = sum("ventas") + sum("compras");
  const avg = R.length ? R.reduce((a,r)=>a+r.estrellas,0)/R.length : 0;
  const prof = D.plan.slice(0,4).filter(p=>dayDone[p.d]).length / 4;
  const conPrueba = L.length ? L.filter(x=>x.prueba).length / L.length : 0;
  const parts = [
    ["Perfil completo y verificado (días 1-4)", 15, prof, "Completa los días 1 a 4 del plan."],
    ["Antigüedad (mín. 21 días, ideal 30)", 25, Math.min(age/30,1), "Solo el tiempo: el factor que más pesa y no se acelera."],
    ["Artículos publicados (~10)", 10, Math.min(L.length/10,1), "Sube artículos reales al ritmo del plan."],
    ["Operaciones reales (4)", 15, Math.min(ops/4,1), "Haz una compra o venta real que necesites."],
    ["Valoraciones (~7, media ≥4)", 15, Math.min(R.length/7,1) * (avg && avg<4 ? .5 : 1), "Envía rápido y pide la valoración con educación."],
    ["Uso regular (~12 días registrados)", 10, Math.min(A.length/12,1), "Cuéntame cada día lo que haces."],
    ["Artículos con prueba de compra", 10, conPrueba, "Anota la prueba de compra de cada par."]
  ];
  const pts = parts.reduce((a,p)=>a+p[1]*p[2],0);
  const pen = Math.min(30, sum("avisos")*5 + L.filter(x=>x.estado==="revision").length*3 + L.filter(x=>x.estado==="rechazado").length*5);
  const score = Math.max(0, pts - pen);
  const checks = [
    ["Más de 21 días de antigüedad (ideal 30)", age >= 21],
    ["~7 valoraciones con media ≥4", R.length >= 7 && avg >= 4],
    ["~10 artículos publicados", L.length >= 10],
    ["Sin avisos ni rechazos", sum("avisos")===0 && L.filter(x=>x.estado==="rechazado").length===0],
    ["Índice de confianza ≥ 3,5", score/20 >= 3.5]
  ];
  return { parts, pen, score, checks, ready: checks.every(c=>c[1]), avg, ops, age };
}

function ring(score) {
  const r = 52, c = 2*Math.PI*r, off = c*(1-score/100);
  return `<svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--acc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 65 65)"/>
    <text x="65" y="64" text-anchor="middle" font-size="28" font-weight="700" fill="var(--ink)">${(score/20).toFixed(1)}</text>
    <text x="65" y="84" text-anchor="middle" font-size="12" fill="var(--mut)">de 5</text></svg>`;
}

// ---- Resumen superior ----
function renderKpis() {
  const T = trust(), age = daysSince(startDate());
  const done = Object.values(dayDone).filter(Boolean).length;
  const sold = D.listings.filter(x => x.estado === "vendido");
  const margen = sold.reduce((a,x) => a + (x.precioVenta||0) - (x.coste||0) - (x.comisionEnvio||0), 0);
  const rev = D.listings.filter(x => x.estado === "revision").length;
  $("kpis").innerHTML = [
    ["","Índice",(T.score/20).toFixed(1)+"/5"],
    ["","Día", age == null ? "–" : Math.min(age+1, D.plan.length)+"/"+D.plan.length],
    ["","Hechos", done],
    ["","Artículos", D.listings.length],
    ["","Valoraciones", D.ratings.length],
    ["","Revisión", rev],
    ["","Margen", eur(margen)]
  ].map(([i,k,v]) => `<div class="kpi"><div><div class="k">${k}</div><div class="v">${v}</div></div></div>`).join("");
}

// ---- Hoy ----
const greeting = () => { const h = new Date().getHours(); return h < 6 ? "Hola." : h < 13 ? "Buenos días." : h < 21 ? "Buenas tardes." : "Buenas noches."; };
function todayText(cur) {
  const p = D.plan[cur-1], sd = stepDone[cur] || [];
  return `DÍA ${cur} DE ${D.plan.length} · ${p.title} (${p.min} min)\n\n` +
    p.steps.map((s,i) => `${sd[i] ? "[x]" : "[ ]"} ${s}`).join("\n") + `\n\nNo hagas: ${p.dont}`;
}
function renderToday() {
  const s = startDate(), age = daysSince(s), cur = age == null ? null : age + 1, plan = D.plan;
  const T = trust();
  let html = "";

  if (cur == null) {
    html += `<div class="card hero"><h2>Aún no has empezado</h2><p class="hint">Cuando hayas creado la cuenta de Vinted, pulsa el botón. Hoy será tu día 1 y el panel contará los días solo.</p><button class="btn" id="start"> He creado la cuenta</button></div>`;
  } else if (cur > plan.length) {
    html += `<div class="card"><h2>Plan completado</h2><p class="hint">Llevas ${cur-1} días. Mira el índice de confianza para ver si ya estás listo para las Samba.</p></div>`;
  } else {
    const p = plan[cur-1], sd = stepDone[cur] || [];
    const missed = plan.filter(x => x.d < cur && !dayDone[x.d]).map(x => x.d);
    const ndone = p.steps.filter((_,i)=>sd[i]).length;
    html += `<div class="card hero today"><div class="th"><div><div class="hint">DÍA ${cur} DE ${plan.length} · ${p.min} MIN</div>
        <h2 style="font-size:19px;margin:2px 0 0">${esc(p.title)}</h2></div>
        <div class="tmr"><span class="timer" id="tm">${fmt(timer.left||p.min*60)}</span><button class="btn ghost sm" id="tgl">${timer.run?"Pausar":"Iniciar"}</button></div></div>
      <div class="bar" style="margin:12px 0 12px"><i style="width:${ndone/p.steps.length*100}%"></i></div>
      <div class="chat">
        <div class="msg"><div class="av"></div><div class="bub">${greeting()} Hoy es el <b>día ${cur} de ${plan.length}</b>: <b>${esc(p.title)}</b>. Te llevará unos <b>${p.min} minutos</b>.</div></div>
        ${missed.length ? `<div class="msg"><div class="av"></div><div class="bub warn"> Te quedan ${missed.length} día${missed.length>1?"s":""} sin completar (${missed.join(", ")}). No pasa nada: haz lo de hoy y sigue a tu ritmo.</div></div>` : ""}
        <div class="msg"><div class="av"></div><div class="bub">Esto es lo que toca hoy (${ndone}/${p.steps.length}):
          <ul class="steps">${p.steps.map((st,i)=>`<li class="${sd[i]?"done":""}" data-s="${i}"><span class="chk">✓</span><span class="tx">${esc(st)}</span></li>`).join("")}</ul></div></div>
        <div class="msg"><div class="av"></div><div class="bub warn"> ${esc(p.dont)}</div></div>
        ${dayDone[cur] ? `<div class="msg"><div class="av"></div><div class="bub ok"> Día completado. ${plan[cur] ? "Mañana: <b>"+esc(plan[cur].title)+"</b> ("+plan[cur].min+" min)." : "¡Has terminado el plan!"}</div></div>`
          : `<div class="msg"><div class="av"></div><div class="bub">Cuando termines, márcalo y cuéntame cómo ha ido en <b>Registro</b>. Tu índice ahora: <b>${(T.score/20).toFixed(1)}/5</b>. ${esc(T.parts.slice().sort((a,b)=>a[2]-b[2])[0][3])}</div></div>`}
      </div>
      <div class="row" style="margin-top:12px;gap:8px">
        <button class="btn" id="fin">${dayDone[cur]?"✔ Día completado":" Marcar día completado"}</button>
        <button class="btn ghost" id="toreg"> Registrar el día</button>
        <button class="btn ghost" id="cpy"> Copiar en texto</button></div></div>`;
  }
  if (cur != null) html += `<p class="hint" style="text-align:center">Alta: ${esc(s)} · <a href="#" id="rst" style="color:var(--mut)">cambiar fecha de alta</a></p>`;
  $("today").innerHTML = html;
  const rs = $("rst"); if (rs) rs.onclick = e => { e.preventDefault();
    const v = prompt("Fecha de alta (AAAA-MM-DD). Déjalo vacío para empezar de cero:", s);
    if (v === null) return;
    if (v && !/^\d{4}-\d{2}-\d{2}$/.test(v)) { alert("Formato no válido"); return; }
    if (!v) { store.set("vp_start", null); } else { store.set("vp_start", v); }
    render(); };
  const st = $("start"); if (st) st.onclick = () => { store.set("vp_start", todayIso()); render(); };
  document.querySelectorAll(".steps li").forEach(li => li.onclick = () => {
    const a = stepDone[cur] || []; a[li.dataset.s] = !a[li.dataset.s]; stepDone[cur] = a; store.set("vp_steps", stepDone); render();
  });
  const f = $("fin"); if (f) f.onclick = () => { dayDone[cur] = !dayDone[cur]; store.set("vp_days", dayDone); render(); };
  const tg = $("tgl"); if (tg) tg.onclick = toggleTimer;
  const tr = $("toreg"); if (tr) tr.onclick = () => showTab("v-reg");
  const cp = $("cpy"); if (cp) cp.onclick = async () => {
    const txt = todayText(cur);
    try { await navigator.clipboard.writeText(txt); cp.textContent = "✔ Copiado"; }
    catch(e) { prompt("Copia el texto:", txt); }
    setTimeout(() => { if ($("cpy")) $("cpy").textContent = " Copiar en texto"; }, 1600); };
}
const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function toggleTimer() {
  const cur = (daysSince(startDate()) ?? 0) + 1, p = D.plan[cur-1]; if (!p) return;
  if (timer.run) { clearInterval(timer.id); timer.run = false; }
  else {
    if (!timer.left) timer.left = p.min * 60;
    timer.run = true;
    timer.id = setInterval(() => { timer.left--; const e = $("tm"); if (e) e.textContent = fmt(Math.max(0,timer.left));
      if (timer.left <= 0) { clearInterval(timer.id); timer.run = false; timer.left = 0; renderToday(); } }, 1000);
  }
  const b = $("tgl"); if (b) b.textContent = timer.run ? "Pausar" : "Iniciar";
}

// ---- Plan ----
function renderPlan() {
  const age = daysSince(startDate()), cur = age == null ? null : age + 1;
  $("cal").innerHTML = D.plan.map(p => {
    let c = "tile";
    if (dayDone[p.d]) c += " done"; else if (cur && p.d < cur) c += " miss";
    if (p.d === cur) c += " cur"; if (p.d === (selDay ?? cur)) c += " sel";
    return `<div class="${c}" data-d="${p.d}" title="${esc(p.title)} · ${p.min} min"><b>${p.d}</b></div>`;
  }).join("");
  document.querySelectorAll(".tile").forEach(t => t.onclick = () => { const n = +t.dataset.d; selDay = (selDay === n) ? null : n; renderPlan(); });
  if (selDay != null && selDay !== cur) {
    const p = D.plan[selDay-1];
    $("dayDetail").innerHTML = `<div class="dd"><div class="hint">DÍA ${selDay} · ${p.min} MIN</div><b>${esc(p.title)}</b>
      <ol class="mini">${p.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol><div class="hint"> ${esc(p.dont)}</div></div>`;
  } else $("dayDetail").innerHTML = "";
}

// ---- Roadmap ----
const PHASES = [
  { ico:"", name:"Alta de la cuenta", from:1, to:4, mile:"Perfil completo, cobro configurado y verificación hecha" },
  { ico:"", name:"Explorar y preparar", from:5, to:8, mile:"2 artículos fotografiados, descritos y con precio" },
  { ico:"", name:"Primeras publicaciones", from:9, to:15, mile:"3 artículos de casa publicados" },
  { ico:"", name:"Primeras operaciones", from:16, to:21, mile:"Primera compra real y primera valoración" },
  { ico:"", name:"Ritmo y reputación", from:22, to:28, mile:"~9 artículos publicados y valoraciones en camino (~7)" },
  { ico:"", name:"Preparar las zapatillas", from:29, to:31, mile:"Fotos, pruebas de compra y descripción listas" }
];
function renderRoad() {
  const age = daysSince(startDate()), cur = age == null ? null : age + 1;
  const total = D.plan.length, done = Object.values(dayDone).filter(Boolean).length;
  $("roadbar").style.width = (done/total*100) + "%";
  $("roadtxt").textContent = `${done} de ${total} días completados` + (cur ? ` · hoy es el día ${Math.min(cur,total)}` : " · aún sin empezar");
  const T = trust();
  let html = PHASES.map((ph, idx) => {
    const days = D.plan.filter(p => p.d >= ph.from && p.d <= ph.to);
    const nd = days.filter(p => dayDone[p.d]).length;
    const isDone = nd === days.length;
    const isCur = !isDone && cur && cur >= ph.from && cur <= ph.to;
    const cls = isDone ? "done" : isCur ? "cur" : "todo";
    return `<div class="s ${cls}" title="${esc(ph.mile)}"><div class="dot">${isDone ? "✓" : idx + 1}</div>
      <div class="txt"><div class="nm">${esc(ph.name)}</div><div class="rg">días ${ph.from}–${ph.to}${isCur ? " · aquí" : ""}</div></div>
      <div class="bar"><i style="width:${nd/days.length*100}%"></i></div></div>`;
  }).join("");
  html += `<div class="s gate ${T.ready?"ok":""}" title="Se abre cuando se cumplan los criterios del índice de confianza"><div class="dot">${T.ready?"✓":PHASES.length + 1}</div>
    <div class="txt"><div class="nm">Primer par de Samba</div><div class="rg">${T.ready ? "¡criterios cumplidos!" : "bloqueado"}</div></div><div class="bar"><i style="width:${T.ready?100:0}%"></i></div></div>`;
  $("roadmap").innerHTML = html;
}

// ---- Cuenta ----
function renderTrust() {
  const T = trust();
  const open = $("trust").querySelector("details")?.open;
  $("trust").innerHTML = `<div class="card tr"><div class="trh">${ring(T.score)}
    <div class="trc"><h2 style="margin-bottom:6px">Índice de confianza</h2>
      <div class="ready ${T.ready?"ok":"no"}"><b>${T.ready?" Listo: 1 par de Samba de prueba":" Aún no subas las Samba"}</b>
      ${T.checks.map(c=>`<div class="hint">${c[1]?"✔":"○"} ${c[0]}</div>`).join("")}</div></div></div>
    <div class="hint" style="margin-top:10px"><b style="color:var(--ink)">Siguiente paso:</b> ${esc(T.parts.slice().sort((a,b)=>a[2]-b[2])[0][3])}</div>
    <details ${open?"open":""}><summary>Ver desglose · ${Math.round(T.score)}/100${T.pen?` · −${T.pen}`:""}</summary>
      <div class="brk">${T.parts.map(p=>`<span>${p[0]}</span><span class="hint">${Math.round(p[1]*p[2])}/${p[1]}</span><div class="bar"><i style="width:${p[2]*100}%"></i></div>`).join("")}</div>
      <div class="hint" style="margin-top:6px">Estimación mía, no una puntuación de Vinted.</div></details></div>`;
}

// ---- Tablas ----
function renderTables() {
  const L = D.listings;
  $("listings").innerHTML = L.length ? `<table><tr><th>Fecha</th><th>Artículo</th><th>Modelo/talla</th><th>Coste</th><th>Precio</th><th>Estado</th><th>Prueba</th><th>Venta</th><th>Margen</th><th>Notas</th><th></th></tr>` +
    L.map((x,i)=>{ const m = x.estado==="vendido" ? (x.precioVenta||0)-(x.coste||0)-(x.comisionEnvio||0) : null;
      const est = x._loc ? `<select onchange="setEstado(${i},this.value)" style="background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:3px">${["activo","revision","vendido","rechazado"].map(o=>`<option ${o===x.estado?"selected":""}>${o}</option>`).join("")}</select>`
        : `<span class="tag ${esc(x.estado)}">${esc(x.estado)}</span>`;
      return `<tr><td>${esc(x.fecha)}</td><td>${esc(x.articulo)}</td><td>${esc(x.modelo)}</td><td>${eur(x.coste)}</td><td>${eur(x.precio)}</td>
      <td>${est}${x.motivo?" · "+esc(x.motivo):""}</td><td>${esc(x.prueba)}</td><td>${eur(x.precioVenta)}</td><td>${m==null?"–":eur(m)}</td><td>${esc(x.notas)}</td><td>${x._loc?`<a href="#" onclick="delItem('listings',${i});return false" style="color:var(--bad)">✕</a>`:""}</td></tr>`; }).join("") + `</table>`
    : `<div class="empty">Aún no hay artículos. Añade el primero con el formulario de arriba.</div>`;
  $("activity").innerHTML = D.activity.length ? `<table><tr><th>Fecha</th><th>Min</th><th>Subidos</th><th>Ventas</th><th>Compras</th><th>Valoraciones</th><th>Avisos</th><th>Notas</th></tr>` +
    D.activity.slice().reverse().map(a=>`<tr><td>${esc(a.fecha)}</td><td>${esc(a.minutos)}</td><td>${esc(a.subidos)}</td><td>${esc(a.ventas)}</td><td>${esc(a.compras)}</td><td>${esc(a.valoraciones)}</td><td>${esc(a.avisos)}</td><td>${esc(a.notas)}</td></tr>`).join("") + `</table>`
    : `<div class="empty">Sin registros todavía.</div>`;
  $("ratings").innerHTML = D.ratings.length ? D.ratings.map(r=>`<div>${"★".repeat(r.estrellas)}${"☆".repeat(5-r.estrellas)} <span class="hint">${esc(r.fecha)} ${esc(r.comentario)}</span></div>`).join("") : `<div class="empty">Sin valoraciones todavía.</div>`;
}

// ---- formularios y edición ----
const inp = "style=\"width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit\"";
const fld = (id, label, type="text", extra="") => `<label class="hint" style="display:block">${label}<input id="${id}" type="${type}" ${extra} ${inp}></label>`;
const gridF = "display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:12px";

function renderForms() {
  $("fAct").innerHTML = `<div style="${gridF}">${fld("a_min","Minutos","number","min=0")}${fld("a_sub","Artículos subidos","number","min=0")}${fld("a_ven","Ventas","number","min=0")}
    ${fld("a_com","Compras","number","min=0")}${fld("a_ava","Avisos o revisiones","number","min=0")}</div>${fld("a_not","Notas")}
    <div class="hint" style="margin:6px 0 12px">Se guarda con la fecha de hoy. Si registras otra vez hoy, se sustituye.</div><button class="btn" id="a_ok">Guardar el día</button>`;
  $("fRat").innerHTML = `<div style="${gridF}"><label class="hint">Estrellas<select id="r_est" ${inp}><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label>${fld("r_com","Comentario")}</div><button class="btn" id="r_ok">Añadir valoración</button>`;
  $("fList").innerHTML = `<div style="${gridF}">${fld("l_art","Artículo (p. ej. Samba OG)")}${fld("l_mod","Modelo / talla")}${fld("l_cos","Coste €","number","step=0.01 min=0")}${fld("l_pre","Precio publicado €","number","step=0.01 min=0")}
    <label class="hint">Estado<select id="l_est" ${inp}><option>activo</option><option>revision</option><option>vendido</option><option>rechazado</option></select></label>${fld("l_pru","Prueba de compra (p. ej. captura pedido)")}</div>${fld("l_not","Notas")}
    <div style="height:12px"></div><button class="btn" id="l_ok">Añadir artículo</button>`;
  $("a_ok").onclick = () => {
    const f = todayIso();
    D.activity = D.activity.filter(x => !(x._loc && x.fecha === f));
    addItem("activity", { fecha:f, minutos:num($("a_min").value), subidos:num($("a_sub").value), ventas:num($("a_ven").value), compras:num($("a_com").value), valoraciones:0, avisos:num($("a_ava").value), notas:$("a_not").value });
    renderForms(); render(); };
  $("r_ok").onclick = () => { addItem("ratings", { fecha:todayIso(), estrellas:+$("r_est").value, comentario:$("r_com").value }); renderForms(); render(); };
  $("l_ok").onclick = () => {
    if (!$("l_art").value.trim()) { alert("Pon al menos el nombre del artículo"); return; }
    addItem("listings", { fecha:todayIso(), articulo:$("l_art").value, modelo:$("l_mod").value, coste:num($("l_cos").value), precio:num($("l_pre").value), estado:$("l_est").value, prueba:$("l_pru").value, notas:$("l_not").value });
    renderForms(); render(); };
}
function setEstado(i, v) {
  const x = D.listings[i]; if (!x || !x._loc) return;
  x.estado = v;
  if (v === "vendido") { x.precioVenta = num(prompt("Precio de venta €", x.precio ?? "")); x.comisionEnvio = num(prompt("Comisión y envío €", "0")); }
  if (v === "revision" || v === "rechazado") { x.motivo = prompt("Motivo (opcional)", x.motivo || "") || ""; }
  saveLoc("listings"); render();
}
function delItem(k, i) { const x = D[k][i]; if (!x || !x._loc || !confirm("¿Borrar?")) return; D[k].splice(i, 1); saveLoc(k); render(); }

$("exp").onclick = () => {
  const data = { start: store.get("vp_start", null), days: dayDone, steps: stepDone,
    listings: store.get("vp_listings", []), activity: store.get("vp_activity", []), ratings: store.get("vp_ratings", []) };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type:"application/json" }));
  a.download = "copia-panel-vinted-" + todayIso() + ".json"; a.click();
};
$("imp").onclick = () => $("impf").click();
$("impf").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try {
    const d = JSON.parse(rd.result);
    store.set("vp_start", d.start ?? null); store.set("vp_days", d.days || {}); store.set("vp_steps", d.steps || {});
    ["listings","activity","ratings"].forEach(k => store.set("vp_"+k, d[k] || []));
    location.reload();
  } catch(err) { alert("Archivo no válido"); } };
  rd.readAsText(f);
};

function render() {
  $("title").textContent = D.account.alias;
  const age = daysSince(startDate());
  $("pill").textContent = age == null ? "Sin fecha de alta" : `Día ${age+1} · semana ${Math.min(Math.floor(age/7)+1,5)}`;
  renderKpis(); renderToday(); renderRoad(); renderPlan(); renderTrust(); renderTables();
}
function showTab(id) {
  document.querySelectorAll("#nav button").forEach(x => x.classList.toggle("on", x.dataset.t === id));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}
$("nav").onclick = e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.t); };
// El panel se entera solo cuando cambia el día (medianoche) o al volver a la pestaña
let lastDay = todayIso();
const checkDay = () => { if (todayIso() !== lastDay) { lastDay = todayIso(); selDay = null; render(); } };
setInterval(checkDay, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkDay(); });
renderForms();
render();
</script>
</body>
</html>
